name: CI

# Build and unit-test on JDK 21. The project uses only the Java standard
# library and plain javac (no Gradle/Maven), so CI needs no dependency
# resolution and is fully reproducible offline.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: ./build.sh
      - name: Version smoke check
        run: java -jar dist/aegis-win.jar --version
